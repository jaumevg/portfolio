<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In Development — Jaume Vidal</title>
    
    <!-- Design System -->
    <link rel="stylesheet" href="../css/base/theme.css">
    <link rel="stylesheet" href="../css/base/reset.css">
    <link rel="stylesheet" href="../css/base/animations.css">
    <link rel="stylesheet" href="../css/base/base.css">
    
    <!-- Specific Component CSS -->
    <link rel="stylesheet" href="../css/components/wip.css">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="wip-page">
    <div class="wip-container">
        <div class="wip-content reveal">
            <div class="wip-icon">
                <i class="fas fa-hammer"></i>
            </div>
            
            <span class="wip-label">
                <i class="fas fa-terminal"></i>
                Status: Compiling
            </span>
            
            <h1 class="wip-title">In Development</h1>
            
            <p class="wip-desc">
                This project is currently being forged in the code mines. Check back later for the final deployment.
            </p>
            
            <a href="../index.html" class="wip-btn">
                <i class="fas fa-arrow-left"></i>
                <span>Return to Base</span>
            </a>
        </div>
    </div>
    
    <script>
        // Reveal animation on load
        document.addEventListener('DOMContentLoaded', () => {
            const el = document.querySelector('.reveal');
            if (el) {
                setTimeout(() => el.classList.add('revealed'), 100);
            }
        });
    </script>
</body>
</html>
