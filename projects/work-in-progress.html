<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In Development | Jaume Vidal</title>
    
    <!-- Design System -->
    <link rel="stylesheet" href="../css/base/theme.css">
    <link rel="stylesheet" href="../css/base/reset.css">
    <link rel="stylesheet" href="../css/base/animations.css">
    <link rel="stylesheet" href="../css/base/base.css">
    
    <!-- Specific Component CSS -->
    <link rel="stylesheet" href="../css/components/wip.css">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- Favicon (Cloud Icon) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 512'><path fill='%23FF9900' d='M0 336c0 79.5 64.5 144 144 144h368c70.7 0 128-57.3 128-128c0-61.9-44-113.6-102.4-125.4c4.1-10.7 6.4-22.4 6.4-34.6c0-53-43-96-96-96c-19.7 0-38.1 6-53.3 16.2C367 64.2 315.3 32 256 32C167.6 32 96 103.6 96 192c0 2.7 .1 5.4 .2 8.1C40.2 219.8 0 273.2 0 336z'/></svg>">
</head>
<body class="wip-page">
    <div class="wip-container">
        <div class="wip-content reveal">
            <div class="wip-icon">
                <i class="fas fa-hammer"></i>
            </div>
            
            <span class="wip-label">
                <i class="fas fa-terminal"></i>
                Status: Compiling
            </span>
            
            <h1 class="wip-title">In Development</h1>
            
            <p class="wip-desc">
                This project is currently being forged in the code mines. Check back later for the final deployment.
            </p>
            
            <a href="../index.html" class="wip-btn">
                <i class="fas fa-arrow-left"></i>
                <span>Return to Base</span>
            </a>
        </div>
    </div>
    
    <script>
        // Reveal animation on load
        document.addEventListener('DOMContentLoaded', () => {
            const el = document.querySelector('.reveal');
            if (el) {
                setTimeout(() => el.classList.add('revealed'), 100);
            }
        });
    </script>
</body>
</html>
